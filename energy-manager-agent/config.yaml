name: "Energy Manager Agent"
version: "2.0.3"
slug: energy-manager-agent
description: "Lokaler Agent des Energy Managers"
url: "https://github.com/klacol/ha-addon-energy-manager-agent"
image: "ghcr.io/klacol/energy-manager-agent"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# Puffer, damit ein laufender SMGW-Abruf sauber abgebrochen werden kann (Default waeren 10s).
timeout: 30
hassio_api: false
host_network: false
options:
  building_code: ""
  rabbitmq_host: ""
  rabbitmq_password: ""
  log_level: "Information"
schema:
  building_code: str
  rabbitmq_host: str
  rabbitmq_password: password
  log_level: list(Trace|Debug|Information|Warning|Error|Critical)
